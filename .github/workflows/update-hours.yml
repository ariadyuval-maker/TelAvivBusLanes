name: Update municipality hours
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: municipality-hours
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run update:hours
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: municipality-capture-${{ github.run_id }}
          path: artifacts/
          retention-days: 14
      - name: Publish validated hours
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bus_lane_hours.js data/municipality-hours.json
          if ! git diff --cached --quiet; then
            git commit -m "Update validated municipality bus lane hours"
            git push
          fi
